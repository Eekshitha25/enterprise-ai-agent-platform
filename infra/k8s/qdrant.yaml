apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          ports: [{ containerPort: 6333 }]
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: qdrant-pvc }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: agent-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: agent-platform
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
